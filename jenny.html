    <script>
        const iframe = document.getElementById('autoIframe');
        
        function resizeIframe() {
            try {
                // Method 1: Direct access (works best if same origin)
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const newHeight = Math.max(
                    iframeDoc.documentElement.scrollHeight,
                    iframeDoc.body.scrollHeight,
                    500 // Minimum height fallback
                );
                
                iframe.style.height = newHeight + 'px';
            } catch (e) {
                // Fallback: If cross-origin, try postMessage (requires cooperation from index.php)
                console.warn('Cross-origin restriction - iframe may need postMessage support');
                iframe.style.height = '100vh'; // Fallback to full height
            }
        }
        
        // Resize when iframe loads
        iframe.onload = function() {
            resizeIframe();
            
            // Re-check after a short delay (some content loads async)
            setTimeout(resizeIframe, 500);
            setTimeout(resizeIframe, 1500);
        };
        
        // Optional: Resize on window resize (for responsive behavior)
        window.addEventListener('resize', () => {
            resizeIframe();
        });
        
        // Bonus: Listen for messages from the iframe (if index.php sends height)
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'iframeHeight') {
                iframe.style.height = event.data.height + 'px';
            }
        });
    </script>
